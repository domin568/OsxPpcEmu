name: All platforms Build, Test

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows / ${{ matrix.compiler }} ${{ matrix.cmake_arch || '' }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: msvc
            preset: win-x64-msvc-release
            cmake_arch: x64
          - compiler: clang
            preset: win-x64-clang-release
          - compiler: mingw
            preset: win-x64-mingw-release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install LLVM and Clang
        if: matrix.compiler == 'clang'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '21'

      - name: Setup MSYS2
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-binutils

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure CMake (MSVC)
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}

      - name: Configure CMake (Clang)
        if: matrix.compiler == 'clang'
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}

      - name: Configure CMake (MinGW)
        if: matrix.compiler == 'mingw'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"

          cmake --preset ${{ matrix.preset }}

      - name: Build Project
        shell: pwsh
        run: |
          if ("${{ matrix.compiler }}" -eq "mingw") {
            $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          }
          cmake --build build/${{ matrix.preset }} --config Release --parallel

      - name: Run Tests
        shell: pwsh
        run: |
          if ("${{ matrix.compiler }}" -eq "mingw") {
            $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          }
          ctest --test-dir build/${{ matrix.preset }} -C Release --output-on-failure

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            arch: x64
            preset: mac-x64-release
          - os: macos-latest
            arch: arm64
            preset: mac-arm64-release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup vcpkg and Cache
        uses: lukka/run-vcpkg@v11

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build Project
        run: |
          cmake --build build/${{ matrix.preset }} --config Release --parallel

      - name: Run Tests with CTest
        run: |
          ctest --test-dir build/${{ matrix.preset }} -C Release --output-on-failure

  linux:
    name: Linux ${{ matrix.arch }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            compiler: gcc
            runner: ubuntu-latest
            preset: lin-x64-gcc-release
          - arch: x64
            compiler: clang
            runner: ubuntu-latest
            preset: lin-x64-clang-release
          - arch: arm64
            compiler: gcc
            runner: ubuntu-26.04-arm
            preset: lin-arm64-gcc-release
          - arch: arm64
            compiler: clang
            runner: ubuntu-26.04-arm
            preset: lin-arm64-clang-release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Clang 22
        if: contains(matrix.compiler, 'clang')
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

      - name: Setup vcpkg and Cache
        uses: lukka/run-vcpkg@v11

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build Project
        run: cmake --build build/${{ matrix.preset }} --config Release -j$(nproc)

      - name: Run Tests
        run: |
          ctest --test-dir build/${{ matrix.preset }} -C Release --output-on-failure
