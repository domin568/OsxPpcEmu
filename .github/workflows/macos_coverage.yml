name: macOS Build, Test, Coverage

on:
  workflow_dispatch:

jobs:
  build-test-coverage:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            arch: x64
            preset: mac-x64-release
          - os: macos-latest
            arch: arm64
            preset: mac-arm64-release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup vcpkg and Cache
        uses: lukka/run-vcpkg@v11

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }} -DENABLE_COVERAGE=ON

      - name: Build Project
        run: |
          cmake --build build/${{ matrix.preset }} --parallel

      - name: Run Tests with CTest
        env:
          LLVM_PROFILE_FILE: "${{ github.workspace }}/coverage-%p.profraw"
        run: |
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Process & Report Code Coverage
        run: |
          xcrun llvm-profdata merge -sparse ${{ github.workspace }}/coverage-*.profraw -o coverage.profdata
          
          IGNORE_PATTERN="vcpkg_installed|_deps|build/|/usr/|/Applications/"

          echo "=== COVERAGE SUMMARY ==="
          xcrun llvm-cov report ./build/${{ matrix.preset }}/test/OsxPpcEmuTest \
            -object=./build/${{ matrix.preset }}/test/OsxPpcEmuE2E \
            -instr-profile=coverage.profdata \
            -ignore-filename-regex="$IGNORE_PATTERN"

          xcrun llvm-cov show ./build/${{ matrix.preset }}/test/OsxPpcEmuTest \
            -object=./build/${{ matrix.preset }}/test/OsxPpcEmuE2E \
            -instr-profile=coverage.profdata \
            -ignore-filename-regex="$IGNORE_PATTERN" \
            -format=html \
            -output-dir=coverage_html

      - name: Upload HTML Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.arch }}
          path: coverage_html
          retention-days: 14
