name: macOS Build, Test, Coverage

on:
  workflow_dispatch:

jobs:
  build-test-coverage:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            triplet: x64-osx
            arch: x64
          - os: macos-latest
            triplet: arm64-osx
            arch: arm64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup vcpkg and Cache
        uses: lukka/run-vcpkg@v11

      - name: Configure CMake
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            OSX_ARCH="x86_64"
          else
            OSX_ARCH="arm64"
          fi
          
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_OSX_ARCHITECTURES="$OSX_ARCH" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build Project
        run: |
          cmake --build build --config Release --parallel

      - name: Run Tests with CTest
        env:
          LLVM_PROFILE_FILE: "${{ github.workspace }}/coverage-%p.profraw"
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Process & Report Code Coverage
        run: |
          xcrun llvm-profdata merge -sparse ${{ github.workspace }}/coverage-*.profraw -o coverage.profdata
          
          IGNORE_PATTERN="vcpkg_installed|_deps|build/|/usr/|/Applications/"

          echo "=== COVERAGE SUMMARY ==="
          xcrun llvm-cov report ./build/test/OsxPpcEmuTest \
            -object=./build/test/OsxPpcEmuE2E \
            -instr-profile=coverage.profdata \
            -ignore-filename-regex="$IGNORE_PATTERN"

          xcrun llvm-cov show ./build/test/OsxPpcEmuTest \
            -object=./build/test/OsxPpcEmuE2E \
            -instr-profile=coverage.profdata \
            -ignore-filename-regex="$IGNORE_PATTERN" \
            -format=html \
            -output-dir=coverage_html

      - name: Upload HTML Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.arch }}
          path: coverage_html
          retention-days: 14
