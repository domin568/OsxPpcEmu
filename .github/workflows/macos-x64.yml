name: macOS x64 Build, Test

on:
  workflow_dispatch:

jobs:
  build:
    name: macOS x64
    runs-on: macos-26-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup vcpkg and Cache
        uses: lukka/run-vcpkg@v11

      - name: Configure CMake
        run: cmake --preset mac-x64-release

      - name: Build Project
        run: cmake --build build/mac-x64-release --parallel

      - name: Run Tests
        run: ctest --test-dir build/mac-x64-release --output-on-failure
